server.port=8082
spring.application.name=kyc-Service


# DB config
spring.datasource.url=jdbc:mysql://localhost:3306/kycdb
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Kafka consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=kyc-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.MoneyWallet.KYC_Service.events.UserRegisteredEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false



# Kafka producer (for KYC status events)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Smile ID credentials (sandbox)
smile.partner-id=PARTNER_ID
smile.api-key=API_KEY
smile.callback-url=http://localhost:8082/api/v1/kyc/smile/callback

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
#eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}
#eureka.instance.prefer-ip-address=true


# local dev file storage
kyc.upload-dir=uploads/kyc
server.url=http://localhost:8082
